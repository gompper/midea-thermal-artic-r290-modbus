views:
  - title: Heat Pump
    icon: mdi:heat-pump-outline
    panel: true
    cards:
      - type: vertical-stack
        cards:
          # === Outdoor Temperature (7 days) ===
          - type: custom:apexcharts-card
            header:
              show: true
              title: Outdoor Temperature (7 days)
            graph_span: 7d
            apex_config:
              chart:
                height: 150
            series:
              - entity: sensor.hp_outdoor_temp
                name: Outdoor (T4)
                color: "#FFA500"
                statistics:
                  type: mean
                  period: hour

          # === Power, Target, Mode, State, Error ===
          - type: horizontal-stack
            cards:
              - type: tile
                entity: switch.hp_power
                name: Power
                icon: mdi:power
                tap_action:
                  action: toggle
              - type: tile
                entity: input_number.hp_target_temp
                name: Target
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: select.hp_mode
                name: Mode
                features:
                  - type: select-options
              - type: entity
                entity: sensor.hp_state_text
                name: State
              - type: entity
                entity: sensor.hp_zone_1_active
                name: Zone 1
                icon: mdi:radiator
              - type: entity
                entity: sensor.hp_error_code
                name: Error
                icon: mdi:alert-circle-outline

          # === Current Water Temps ===
          - type: horizontal-stack
            cards:
              - type: entity
                entity: sensor.hp_outdoor_temp
                name: Outdoor
                icon: mdi:thermometer
              - type: entity
                entity: sensor.hp_water_inlet_temp
                name: Inlet
                icon: mdi:thermometer-chevron-down
              - type: entity
                entity: sensor.hp_outlet_water_temp
                name: Outlet
                icon: mdi:thermometer-chevron-up
              - type: entity
                entity: sensor.hp_delta_t
                name: Delta T
                icon: mdi:thermometer-lines
              - type: entity
                entity: sensor.hp_water_flow
                name: Water Flow
                icon: mdi:water-pump

          # === Water Temperatures (24h history) ===
          - type: history-graph
            title: Water Temperatures
            hours_to_show: 24
            entities:
              - entity: sensor.hp_outlet_water_temp
                name: Outlet (T1)
              - entity: sensor.hp_water_inlet_temp
                name: Inlet (Tw_in)
              - entity: sensor.hp_outdoor_temp
                name: Outdoor (T4)

          # === Electrical ===
          - type: horizontal-stack
            cards:
              - type: entity
                entity: sensor.hp_power_consumption
                name: Power
                icon: mdi:lightning-bolt
              - type: entity
                entity: sensor.hp_odu_current
                name: ODU Current
                icon: mdi:current-ac
              - type: entity
                entity: sensor.hp_odu_voltage
                name: ODU Voltage
                icon: mdi:flash
              - type: entity
                entity: sensor.hp_odu_power
                name: ODU Power
                icon: mdi:lightning-bolt

          # === Compressor & Pressure ===
          - type: horizontal-stack
            cards:
              - type: entities
                entities:
                  - entity: sensor.hp_cop_filtered
                    name: COP
                    icon: mdi:leaf
                header:
                  type: graph
                  entity: sensor.hp_cop_filtered
                  detail: 2
              - type: entities
                entities:
                  - entity: sensor.hp_compressor_frequency
                    name: Compressor
                    icon: mdi:sine-wave
                header:
                  type: graph
                  entity: sensor.hp_compressor_frequency
                  detail: 2
              - type: gauge
                entity: sensor.hp_high_pressure
                name: High Pressure
                min: 0
                max: 4000
                unit: kPa
                severity:
                  green: 0
                  yellow: 2500
                  red: 3500
              - type: gauge
                entity: sensor.hp_low_pressure
                name: Low Pressure
                min: 0
                max: 1500
                unit: kPa
                severity:
                  green: 200
                  yellow: 100
                  red: 0

          # === Power+Freq / Refrigerant ===
          - type: horizontal-stack
            cards:
              - type: statistics-graph
                title: Power
                entities:
                  - entity: sensor.hp_power_consumption
                  - entity: sensor.hp_odu_power
                stat_types:
                  - mean
                period: 5minute
                days_to_show: 2
              - type: history-graph
                title: Refrigerant Circuit
                hours_to_show: 24
                entities:
                  - entity: sensor.hp_condenser_temp
                    name: Condenser (T3)
                  - entity: sensor.hp_discharge_temp
                    name: Discharge (Tp)
                  - entity: sensor.hp_suction_temp
                    name: Suction (Th)

          # === COP History ===
          - type: history-graph
            title: COP
            hours_to_show: 24
            entities:
              - entity: sensor.hp_cop_filtered
                name: COP

          # === Energy Summary ===
          - type: horizontal-stack
            cards:
              - type: entity
                entity: sensor.hp_energy_daily
                name: Today
                icon: mdi:counter
              - type: entity
                entity: sensor.hp_energy_monthly
                name: Month
                icon: mdi:calendar-month
              - type: entity
                entity: sensor.hp_energy_yearly
                name: Year
                icon: mdi:calendar
              - type: entity
                entity: sensor.hp_energy_total
                name: Total
                icon: mdi:sigma

          # === Daily Energy ===
          - type: statistics-graph
            title: Daily Energy (kWh)
            entities:
              - entity: sensor.hp_energy_total
            chart_type: bar
            stat_types:
              - change
            period: day
            days_to_show: 30

          # === Monthly Energy ===
          - type: statistics-graph
            title: Monthly Energy (kWh)
            entities:
              - entity: sensor.hp_energy_total
            chart_type: bar
            stat_types:
              - change
            period: month
            days_to_show: 365

          # === Yearly Energy ===
          - type: statistics-graph
            title: Yearly Energy (kWh)
            entities:
              - entity: sensor.hp_energy_total
            chart_type: bar
            stat_types:
              - change
            period: year
            days_to_show: 1825
